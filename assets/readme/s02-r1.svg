<svg xmlns="http://www.w3.org/2000/svg" width="820" height="133" viewBox="0 0 820 133" role="img" aria-label="Phytoplankton. Drifting algae produce roughly half of Earth&#x27;s oxygen. Copepods. Likely the most abundant animal on Earth. Microfragmentation. Cutting corals into 1cm chunks triggers a 5 to 25x growth boost."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a4f68"/><stop offset="1" stop-color="#6f4f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="260.7" height="133" rx="10"/></clipPath><rect width="260.7" height="133" rx="10" fill="url(#n)"/><rect width="260.7" height="4" fill="#8a4f68" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="259.7" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="132" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decdd4">Phytoplankton</text><text x="132" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Drifting algae produce</text><text x="132" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">roughly half of Earth&#x27;s</text><text x="132" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">oxygen.</text></g><g transform="translate(272.7,0)"><clipPath id="c0_1"><rect width="228.1" height="133" rx="10"/></clipPath><rect width="228.1" height="133" rx="10" fill="url(#n)"/><rect width="228.1" height="4" fill="#8a4f68" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="227.1" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="116" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decdd4">Copepods</text><text x="116" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Likely the most</text><text x="116" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">abundant animal on</text><text x="116" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">Earth.</text></g><g transform="translate(512.8,0)"><clipPath id="c0_2"><rect width="307.2" height="133" rx="10"/></clipPath><rect width="307.2" height="133" rx="10" fill="url(#n)"/><rect width="307.2" height="4" fill="#8a4f68" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="306.2" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="156" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decdd4">Microfragmentation</text><text x="156" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Cutting corals into 1cm chunks</text><text x="156" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">triggers a 5 to 25x growth boost.</text></g></g></svg>
